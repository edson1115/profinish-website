<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css?v=5">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ProFinish Elite Glass & Keys delivers expert auto glass replacement, paintless dent repair, wheel rim repair, and commercial fleet services.">
    <meta name="keywords" content="auto glass repair, windshield replacement, paintless dent repair, wheel rim repair, fleet telematics">

    <title>Blog - ProFinish Elite Glass & Keys</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="brand_assets/ProFinishEliteFavicon.png" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#050A14',
                            800: '#0A1220',
                            700: '#111D33',
                            600: '#1C2E4A'
                        },
                        orange: {
                            500: '#F26522',
                            600: '#D95214'
                        },
                        slate: {
                            300: '#A1B0C8',
                            400: '#7588A6'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050A14;
            color: #ffffff;
        }

        .bg-grain::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 50;
            mix-blend-mode: overlay;
        }

        .glass-panel {
            background: rgba(10, 18, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16,1,0.3,1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* SORO BLOG FIX */

        #soro-blog,
        #soro-blog * {
            color: #ffffff !important;
        }

        #soro-blog a {
            color: #F26522 !important;
            pointer-events: auto !important;
            cursor: pointer !important;
        }

        #soro-blog article,
        #soro-blog div,
        #soro-blog section {
            background: transparent !important;
        }

        #soro-blog img {
            border-radius: 14px;
        }

        #soro-blog [role="button"],
        #soro-blog .cursor-pointer,
        #soro-blog a,
        #soro-blog article {
            pointer-events: auto !important;
            cursor: pointer !important;
        }

        #soro-blog iframe {
            pointer-events: auto !important;
        }

        /* DO NOT BLOCK CLICKS */
        .bg-grain::before {
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-grain relative antialiased min-h-screen flex flex-col">

    <!-- NAV -->

    <nav class="fixed w-full z-40 top-0 pt-6 px-6">
        <div class="max-w-7xl mx-auto glass-panel rounded-full px-6 py-4 flex justify-between items-center">

            <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <img src="./brand_assets/ProFinishEliteLogo.png"
                     alt="ProFinish Elite Logo"
                     class="h-10 w-auto rounded-md">

                <span class="font-bold text-xl tracking-tight hidden sm:block">
                    ProFinish Elite Glass & Keys
                    <span class="text-orange-500">.</span>
                </span>
            </a>

            <div class="hidden md:flex gap-8 text-sm font-medium text-slate-300">

                <a href="index.html#services" class="hover:text-white transition-colors">
                    Services
                </a>

                <a href="contact.html" class="text-white transition-colors">
                    Start Quote
                </a>

                <a href="tel:+18303563456"
                   class="hover:text-white transition-colors">
                    (830) 356-3456
                </a>
            </div>
        </div>
    </nav>

    <!-- MAIN -->

    <main class="flex-grow pt-40 pb-20 relative z-10">

        <div class="max-w-6xl mx-auto px-6 py-16">

            <div class="text-center mb-16">
                <h1 class="reveal text-5xl md:text-6xl font-bold mb-6 tracking-tighter">
                    Latest News & Tips
                </h1>

                <p class="reveal text-xl text-gray-400">
                    Expert advice on maintaining your vehicle's finish.
                </p>
            </div>

            <!-- SORO BLOG -->

            <div class="reveal w-full min-h-[500px]">

                <div id="soro-blog"></div>

                <script
                    src="https://app.trysoro.com/api/embed/d4103ec8-778e-4ccb-9f7f-b1ab513d576b"
                    defer>
                </script>

            </div>
        </div>
    </main>

    <!-- FOOTER -->

    <footer class="border-t border-navy-700 bg-navy-900 pt-16 pb-8 px-6 mt-auto">

        <div class="max-w-7xl mx-auto text-center">

            <p class="text-slate-500 text-sm">
                © 2026 ProFinish Elite Glass & Keys.
                All rights reserved.
            </p>

        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const observer = new IntersectionObserver((entries) => {

                entries.forEach(entry => {

                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }

                });

            });

            document.querySelectorAll('.reveal').forEach(el => {
                observer.observe(el);
            });

        });
    </script>

</body>
</html>
